<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Learn about E-BIKE — our mission, story, and commitment to revolutionizing urban mobility with premium electric bikes.">
    <title>About Us | E-BIKE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="dist/about.css">
</head>

<body class="font-inter bg-white text-[#1c1b1b] antialiased">

    <header class="sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-[1440px] mx-auto px-12 h-16 flex items-center justify-between relative">

            <a href="/" class="flex items-center shrink-0">
                <img src="img/icons/logo.svg" alt="E-BIKE logo" class="h-5 w-auto">
            </a>

            <nav class="absolute left-1/2 -translate-x-1/2">
                <ul class="flex items-center gap-10">
                    <li>
                        <a href="#"
                            class="text-[13px] font-medium tracking-wider text-gray-500 hover:text-[#1c1b1b] transition-colors duration-200 py-[22px]">MODELS</a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[13px] font-medium tracking-wider text-gray-500 hover:text-[#1c1b1b] transition-colors duration-200 py-[22px]">EXPERIENCE</a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[13px] font-bold tracking-wider text-[#1c1b1b] py-[22px] relative after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-full after:h-0.5 after:bg-[#1c1b1b]"
                            id="nav-about">ABOUT</a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[13px] font-medium tracking-wider text-gray-500 hover:text-[#1c1b1b] transition-colors duration-200 py-[22px]">SUPPORT</a>
                    </li>
                </ul>
            </nav>

            <div class="flex items-center gap-5 shrink-0" id="header-actions">
                <button
                    class="flex items-center justify-center w-9 h-9 rounded-full hover:bg-gray-100 hover:scale-105 transition-all duration-200 cursor-pointer"
                    aria-label="Search">
                    <img src="img/icons/search.svg" alt="Search" class="w-[18px] h-[18px]">
                </button>
                <button
                    class="flex items-center justify-center w-9 h-9 rounded-full hover:bg-gray-100 hover:scale-105 transition-all duration-200 cursor-pointer"
                    aria-label="Shopping cart">
                    <img src="img/icons/cart.svg" alt="Cart" class="w-[18px] h-[18px]">
                </button>
                <button
                    class="flex items-center justify-center w-9 h-9 rounded-full hover:bg-gray-100 hover:scale-105 transition-all duration-200 cursor-pointer"
                    aria-label="Account">
                    <img src="img/icons/account.svg" alt="Account" class="w-[18px] h-[18px]">
                </button>
            </div>

        </div>
    </header>

</body>

</html>
