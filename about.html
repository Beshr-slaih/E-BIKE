<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Learn about E-BIKE — our mission, story, and commitment to revolutionizing urban mobility with premium electric bikes.">
    <title>E-BIKE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="font-inter bg-white text-[#1c1b1b] antialiased">
    <header class=" header sticky top-0 z-50 bg-white border-b border-gray-200">
        <div class="max-w-[1440px] mx-auto px-5 lg:px-12 h-16 flex items-center justify-between relative">
            <a href="/" class="flex items-center shrink-0">
                <img src="img/icons/logo.svg" alt="E-BIKE logo" class="h-4 lg:h-5 w-auto">
            </a>

            <nav class="hidden lg:block absolute left-1/2 -translate-x-1/2">
                <ul class="flex items-center gap-10">
                    <li>
                        <a href="#"
                            class="text-[13px] font-medium tracking-wider text-gray-500 hover:text-[#1c1b1b] transition-colors duration-200 py-[22px]">MODELS</a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[13px] font-medium tracking-wider text-gray-500 hover:text-[#1c1b1b] transition-colors duration-200 py-[22px]">EXPERIENCE</a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[13px] font-medium tracking-wider text-gray-500 hover:text-[#1c1b1b] transition-colors duration-200 py-[22px]">ABOUT</a>
                    </li>
                    <li>
                        <a href="#"
                            class="text-[13px] font-medium tracking-wider text-gray-500 hover:text-[#1c1b1b] transition-colors duration-200 py-[22px]">SUPPORT</a>
                    </li>
                </ul>
            </nav>

            <div class="flex items-center gap-2 lg:gap-5 shrink-0">
                <button
                    class="flex items-center justify-center w-9 h-9 rounded-full hover:bg-gray hover:scale-105 transition-all duration-200 cursor-pointer"
                    aria-label="Search">
                    <img src="img/icons/search.svg" alt="Search" class="w-[18px] h-[18px]">
                </button>
                <button
                    class="flex items-center justify-center w-9 h-9 rounded-full hover:bg-gray hover:scale-105 transition-all duration-200 cursor-pointer"
                    aria-label="Shopping cart">
                    <img src="img/icons/cart.svg" alt="Cart" class="w-[18px] h-[18px]">
                </button>
                <button
                    class="hidden lg:flex items-center justify-center w-9 h-9 rounded-full hover:bg-gray hover:scale-105 transition-all duration-200 cursor-pointer"
                    aria-label="Account">
                    <img src="img/icons/account.svg" alt="Account" class="w-[18px] h-[18px]">
                </button>

                <button
                    class="lg:hidden flex flex-col justify-center items-center gap-[4px] w-9 h-9 rounded-full hover:bg-gray transition-colors"
                    aria-label="menu">
                    <span class="block w-[18px] h-[2px] bg-[#1c1b1b] rounded-full"></span>
                    <span class="block w-[18px] h-[2px] bg-[#1c1b1b] rounded-full"></span>
                    <span class="block w-[18px] h-[2px] bg-[#1c1b1b] rounded-full"></span>
                </button>
            </div>
        </div>
    </header>


    <section class=" hero relative h-[600px] md:h-[800px] lg:h-[calc(100vh-64px)] w-full bg-cover bg-center bg-no-repeat"
        style="background-image: url('./img/about_page/Hero_Section.png');">
        <div class="relative z-10 max-w-[1440px] mx-auto px-12 h-full flex flex-col justify-between pt-8 pb-16">
            <div class="text-white/90 text-sm font-semibold tracking-widest uppercase">
                E-BIKE / ABOUT
            </div>
            <div class="text-white">
                <h1 class="text-6xl md:text-[5.5rem] font-black mb-4 tracking-tight leading-none">About us</h1>
                <p class="text-xs md:text-sm font-bold tracking-[0.25rem] uppercase text-gray-200">Forever Forward</p>
            </div>
        </div>
    </section>

</body>

</html>
